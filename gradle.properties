# JDK 21 在 Windows 上按本机编码读取 Java 参数文件；COMPAT 避免 Gradle 测试的中文路径损坏。
# Kotlin / XML / 文档源码仍统一使用 UTF-8，详见开发状态/构建与环境.md。
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=COMPAT
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
android.useAndroidX=true
android.nonTransitiveRClass=true
# 用户指定的中文工程目录；本项目没有 NDK/CMake，构建与安装将实际验证路径兼容性。
android.overridePathCheck=true
kotlin.code.style=official
